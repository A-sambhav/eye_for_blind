; Smart Glasses firmware — PlatformIO configuration
;
; TODO(bringup): confirm exact `board` id for Arduino UNO Q once
; available in platform-arduino's board index; placeholder below assumes
; a generic Cortex-M7 target and will need adjusting against the real
; board definition.

[env:smart_glass_uno_q]
platform = ststm32       ; TODO: replace with the correct platform package
                          ; for Arduino UNO Q once confirmed (HW-ARCH-001.md)
board = genericSTM32H743 ; TODO: replace with actual UNO Q board id
framework = arduino

build_flags =
    -std=gnu11
    -Isrc/drivers/include
    -Isrc/hal/include
    -Isrc/middleware/include
    -Isrc/ai/include
    -Isrc/decision/include
    -Isrc/navigation/include
    -Isrc/voice/include
    -Isrc/application/include
    -Isrc/database/include

; FreeRTOS is expected via a library dependency once pinned to a version;
; left unpinned here pending hardware bring-up decisions.
lib_deps =
    ; freertos ; TODO: pin exact FreeRTOS package/version for this target

monitor_speed = 115200
